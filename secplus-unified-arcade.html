<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SY0-701 Unified Practice Arcade</title>
<style>
  :root{
    --bg:#070c12;
    --panel:#101923;
    --panel-2:#0c141c;
    --line:#1e2c39;
    --accent:#57c7d4;
    --accent-dim:#2f5c63;
    --ok:#8bd17c;
    --warn:#e8b34c;
    --danger:#ef5a68;
    --text:#dce6ef;
    --text-dim:#88a0b3;
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{
    min-height:100vh;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:34px 34px;
    background-attachment:fixed;
    background-color:var(--bg);
    transition:background-color .2s ease, color .2s ease;
  }
  body.light{
    --bg:#eef2f6;
    --panel:#ffffff;
    --panel-2:#f4f7fa;
    --line:#d7dee5;
    --text:#1b2733;
    --text-dim:#5b6b7a;
  }
  body.light button.btn.primary{color:#ffffff;}
  #app{max-width:1000px;margin:0 auto;padding:18px 16px 60px;}

  .console-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;
    border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px;}
  .console-head h1{font-family:var(--mono);font-size:18px;letter-spacing:0.5px;color:var(--accent);margin:0;font-weight:600;}
  .console-head h1 span{color:var(--text-dim);font-weight:400;}
  .breadcrumb{font-family:var(--mono);font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:14px;}
  .breadcrumb button{background:none;border:none;color:var(--warn);font-family:var(--mono);font-size:12px;cursor:pointer;padding:0;}
  .breadcrumb button:hover{text-decoration:underline;}
  .gear-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);font-family:var(--mono);
    font-size:12px;padding:6px 10px;cursor:pointer;}
  .gear-btn:hover{border-color:var(--accent-dim);color:var(--text);}

  .settings-box{background:var(--panel);border:1px solid var(--accent-dim);max-width:460px;width:100%;padding:26px 24px;}
  .settings-box h3{font-family:var(--mono);font-size:15px;color:var(--accent);margin:0 0 4px;}
  .settings-box .sec-label{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);letter-spacing:0.5px;
    margin:18px 0 8px;text-transform:uppercase;}
  .mode-row{display:flex;gap:8px;}
  .mode-row button{flex:1;font-family:var(--mono);font-size:13px;padding:9px;background:var(--panel-2);
    border:1px solid var(--line);color:var(--text);cursor:pointer;}
  .mode-row button.active{border-color:var(--accent);color:var(--accent);}
  .swatch-row{display:flex;gap:8px;flex-wrap:wrap;}
  .swatch{width:34px;height:34px;border:2px solid var(--line);cursor:pointer;border-radius:50%;}
  .swatch.active{border-color:var(--text);}
  .color-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:13px;}
  .color-row input[type=color]{width:40px;height:28px;border:1px solid var(--line);background:none;cursor:pointer;padding:0;}

  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width:760px){.grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:480px){.grid{grid-template-columns:1fr;}}
  .node{position:relative;background:var(--panel);border:1px solid var(--line);padding:20px 18px;cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;}
  .node:hover{border-color:var(--accent-dim);}
  .node:active{transform:scale(0.99);}
  .node::before,.node::after{content:"";position:absolute;width:10px;height:10px;}
  .node::before{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);}
  .node::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent);}
  .node .tag{font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:1px;}
  .node h2{font-family:var(--mono);font-size:16.5px;margin:8px 0 6px;color:var(--text);}
  .node p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.5;}
  .stat-line{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-top:10px;}
  .intro{font-size:14px;color:var(--text-dim);line-height:1.6;margin:0 0 16px;max-width:720px;}
  .intro b{color:var(--text);}

  .domain-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;font-family:var(--mono);font-size:12.5px;}
  .domain-bar select{background:var(--panel-2);color:var(--text);border:1px solid var(--line);font-family:var(--mono);
    font-size:12.5px;padding:7px 10px;}
  .domain-bar .k{color:var(--text-dim);}

  button.btn{font-family:var(--mono);background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    padding:9px 16px;font-size:13px;cursor:pointer;}
  button.btn:hover{border-color:var(--accent-dim);}
  button.btn.primary{background:var(--accent);color:#04191d;border-color:var(--accent);font-weight:600;}
  button.btn.primary:hover{filter:brightness(1.08);}
  button.btn.ghost{background:transparent;}
  button.btn:disabled{opacity:0.4;cursor:default;}

  .hud{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:13px;
    background:var(--panel-2);border:1px solid var(--line);padding:10px 14px;margin-bottom:16px;}
  .hud .k{color:var(--text-dim);margin-right:4px;}
  .hud .v{color:var(--warn);font-weight:600;}
  .lives{display:flex;gap:5px;}
  .life{width:12px;height:12px;background:var(--danger);}
  .life.dead{background:#2a1418;}
  .timerbar-wrap{flex:1;min-width:120px;height:8px;background:var(--panel);border:1px solid var(--line);overflow:hidden;}
  .timerbar{height:100%;background:var(--accent);width:100%;transition:width .1s linear, background .2s;}

  .qcard{background:var(--panel);border:1px solid var(--line);padding:24px 20px;text-align:center;}
  .qcard .term{font-family:var(--mono);font-size:26px;color:var(--accent);letter-spacing:0.5px;margin-bottom:4px;line-height:1.3;}
  .qcard .sub{font-size:12px;color:var(--text-dim);font-family:var(--mono);}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
  @media (max-width:560px){.choices{grid-template-columns:1fr;}}
  .choice{background:var(--panel-2);border:1px solid var(--line);padding:13px 14px;text-align:left;font-size:13.5px;
    cursor:pointer;color:var(--text);line-height:1.4;}
  .choice:hover{border-color:var(--accent-dim);}
  .choice.correct{border-color:var(--ok);background:color-mix(in srgb, var(--ok) 18%, var(--panel));color:var(--ok);}
  .choice.wrong{border-color:var(--danger);background:color-mix(in srgb, var(--danger) 18%, var(--panel));color:var(--danger);}
  .choice.disabled{pointer-events:none;}
  .feedback{margin-top:14px;font-family:var(--mono);font-size:13px;min-height:18px;}
  .feedback.ok{color:var(--ok);}
  .feedback.bad{color:var(--danger);}
  .endscreen{text-align:center;padding:40px 20px;}
  .endscreen .big{font-family:var(--mono);font-size:40px;color:var(--accent);}

  .match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media (max-width:600px){.match-grid{grid-template-columns:repeat(2,1fr);}}
  .mcard{aspect-ratio:1/0.85;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;
    justify-content:center;text-align:center;padding:8px;cursor:pointer;font-size:11.5px;line-height:1.3;color:var(--text);}
  .mcard.term{font-family:var(--mono);font-size:14px;color:var(--accent);}
  .mcard.hidden{background:repeating-linear-gradient(45deg,var(--panel) 0 6px, var(--panel-2) 6px 12px);color:transparent;}
  .mcard.matched{border-color:var(--ok);opacity:0.35;cursor:default;}
  .mcard.wrongflash{border-color:var(--danger);}

  .wheel-wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;justify-content:center;margin-bottom:16px;}
  #wheelCanvas{background:var(--panel);border:1px solid var(--line);}
  .spin-col{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .phrase{font-family:var(--mono);font-size:18px;letter-spacing:2px;text-align:center;line-height:1.9;word-break:break-word;
    background:var(--panel);border:1px solid var(--line);padding:18px 14px;margin-bottom:14px;}
  .kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px;margin:0 auto;}
  .kb button{width:34px;height:34px;font-family:var(--mono);font-size:14px;background:var(--panel-2);
    border:1px solid var(--line);color:var(--text);cursor:pointer;}
  .kb button:disabled{opacity:0.25;cursor:default;}
  .kb button.hit{border-color:var(--ok);color:var(--ok);}
  .kb button.miss{border-color:var(--danger);color:var(--danger);}
  .strikes{display:flex;gap:5px;}
  .strike{width:20px;height:20px;border:1px solid var(--danger);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:12px;color:var(--panel);}
  .strike.on{background:var(--danger);color:#fff;}
  .clue-hint{font-family:var(--mono);font-size:11px;color:var(--text-dim);text-align:center;margin-top:-6px;margin-bottom:10px;}

  .jcat-row{display:grid;gap:6px;margin-bottom:6px;}
  .jcell{background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    padding:16px 6px;cursor:pointer;font-family:var(--mono);}
  .jcat{background:var(--panel);color:var(--accent);font-size:11.5px;text-align:center;padding:10px 4px;font-weight:600;line-height:1.3;}
  .jval{color:var(--ok);font-size:18px;}
  .jcell.used{background:transparent;border-color:var(--panel);color:transparent;cursor:default;}
  .clue-modal{position:fixed;inset:0;background:rgba(4,7,10,0.88);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;}
  .clue-box{background:var(--panel);border:1px solid var(--accent-dim);max-width:560px;width:100%;padding:28px 24px;}
  .clue-box .cat{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-bottom:14px;}
  .clue-box .cluetext{font-size:16.5px;line-height:1.6;margin-bottom:20px;}
  .clue-box input{width:100%;padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:var(--mono);font-size:14px;margin-bottom:12px;}
  .clue-box .answer-reveal{font-family:var(--mono);color:var(--accent);margin-bottom:14px;font-size:15px;}
  .row-gap{display:flex;gap:10px;flex-wrap:wrap;}
  .score-strip{font-family:var(--mono);font-size:14px;color:var(--accent);margin-bottom:12px;}

  /* sequence lab */
  .seq-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .seq-chip{background:var(--panel-2);border:1px solid var(--line);padding:10px 14px;font-size:13.5px;cursor:pointer;}
  .seq-chip:hover{border-color:var(--accent-dim);}
  .seq-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .seq-row{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:10px 14px;font-size:13.5px;}
  .seq-row .num{font-family:var(--mono);color:var(--text-dim);min-width:20px;}
  .seq-row.correct{border-color:var(--ok);}
  .seq-row.wrong{border-color:var(--danger);}
  .seq-row .correction{font-family:var(--mono);font-size:11.5px;color:var(--warn);margin-left:auto;}

  /* placement lab */
  .zones{display:grid;gap:10px;margin-bottom:20px;}
  .zone-box{background:var(--panel);border:1px dashed var(--line);padding:14px;min-height:90px;}
  .zone-box.flash{border-color:var(--danger);}
  .zone-title{font-family:var(--mono);font-size:12px;color:var(--accent);margin-bottom:8px;}
  .zone-items{display:flex;flex-wrap:wrap;gap:6px;}
  .placed-chip{background:color-mix(in srgb, var(--ok) 18%, var(--panel));border:1px solid var(--ok);color:var(--ok);padding:6px 10px;font-size:12px;}
  .place-pool{display:flex;flex-wrap:wrap;gap:8px;}
  .place-chip{background:var(--panel-2);border:1px solid var(--line);padding:9px 13px;font-size:13px;cursor:pointer;}
  .place-chip:hover{border-color:var(--accent-dim);}
  .place-chip.selected{border-color:var(--warn);color:var(--warn);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   DOMAIN TERM BANK — 5 main SY0-701 exam domains + 15 PBQ subdomains
   kept as two distinct groups, never merged into one flat list
   ============================================================ */
const MAIN_DOMAINS = {
  gsc:"1.0 General Security Concepts",
  tvm:"2.0 Threats, Vulnerabilities & Mitigations",
  arch:"3.0 Security Architecture",
  ops:"4.0 Security Operations",
  gov:"5.0 Security Program Mgmt & Oversight"
};
const PBQ_DOMAINS = {
  rag:"Secure AI / RAG Configuration", zta:"Zero Trust Architecture", pki:"PKI & Cryptography",
  lnx:"Linux Breach Response", bcdr:"BCDR & Recovery", siem:"SIEM & SOAR",
  acl:"Firewall ACL Rules", fw:"Advanced Firewall Config", ids:"IDS/IPS Alert Analysis",
  ir:"Incident Response Phases", log:"Security Log Analysis", netdiag:"Network Security Diagram",
  subnet:"Subnetting & VLSM", hard:"System Hardening", wifi:"Wireless AP Configuration"
};
const DOMAINS = { ...MAIN_DOMAINS, ...PBQ_DOMAINS };

const PBQ_RAW = [
["rag","Prompt Injection","An attacker crafts input that manipulates an LLM into ignoring its instructions or bypassing safety guardrails."],
["rag","Data Poisoning","An attacker corrupts training or retrieval-source data so the model learns or surfaces malicious or false content."],
["rag","Model Inversion","An attacker queries a model repeatedly to reconstruct or infer sensitive data it was trained on."],
["rag","Guardrails","Input and output filters, content policies, and system prompts that constrain what a GenAI system will do."],
["rag","Retrieval-Augmented Generation","Combines an LLM with a retrieval step over an external knowledge base to ground answers in current, trusted data."],
["rag","Output Sanitization","Filtering or encoding model output before it reaches downstream systems, preventing injected commands or scripts from executing."],
["rag","Least Privilege for AI Agents","Restricting an AI agent's tool and API access to only what its current task requires."],
["rag","Vector Store Poisoning","Injecting malicious documents into the embeddings database so RAG retrieval later surfaces attacker-controlled content."],
["rag","Agent Sandboxing","Isolating an AI agent's code execution or tool use so a hijacked session cannot reach the wider environment."],
["rag","Human-in-the-loop Approval","Requiring a person to approve high-risk actions before an autonomous AI agent executes them."],

["zta","Zero Trust","The principle of never trusting a request implicitly based on network location, verifying every time instead."],
["zta","ZTNA","Brokered, identity- and context-based access to applications that replaces a traditional perimeter VPN."],
["zta","Micro-segmentation","Dividing a network into small, isolated zones so a breach in one cannot easily spread laterally."],
["zta","CASB","A control point enforcing policy and visibility between users and cloud services."],
["zta","PAM","Vaulting, monitoring, and time-limiting the use of privileged administrator credentials."],
["zta","Continuous Authentication","Ongoing verification of a session's trust level throughout its life, not just at initial login."],
["zta","JIT Access","Granting elevated privileges only for a short, limited window when actually needed."],
["zta","Policy Enforcement Point","The control point that actually allows or blocks a request based on a policy decision."],
["zta","Policy Decision Point","The component that evaluates identity, device, and risk context to decide whether access should be granted."],
["zta","Minimized Implicit Trust","The goal of Zero Trust is to shrink any area where trust is assumed rather than continuously verified."],

["pki","Root CA","The self-signed, offline trust anchor at the very top of a certificate chain."],
["pki","Intermediate CA","A CA certificate signed by the root, used to issue day-to-day certificates while the root stays offline."],
["pki","Leaf Certificate","The certificate issued to a specific server or user, signed by an intermediate CA."],
["pki","Chain Validation","Verifying trust from the leaf certificate up to a trusted root, checking each signature along the way."],
["pki","CRL","A downloaded list identifying certificates that have been revoked."],
["pki","OCSP","A real-time online check of a single certificate's revocation status."],
["pki","Revocation Trigger","A certificate should be flagged for revocation when its private key is compromised or it was mis-issued."],
["pki","Symmetric vs Asymmetric","Symmetric ciphers like AES are fast for bulk data; asymmetric ciphers like RSA/ECC handle key exchange and signatures."],
["pki","Perfect Forward Secrecy","Ephemeral key exchange such as DHE or ECDHE keeps past sessions safe even if a long-term key is later compromised."],
["pki","Hash Selection","Use SHA-2 or SHA-3 for integrity checks; avoid MD5 and SHA-1 in security-sensitive contexts."],

["lnx","sshd_config Hardening","Disable root login and password authentication, allowing only key-based SSH access."],
["lnx","fail2ban","Watches logs and temporarily bans source IPs after repeated failed login attempts."],
["lnx","UFW Default Policy","Set default deny on incoming traffic, then explicitly allow only the ports actually required."],
["lnx","Change Interdependency","Disabling password authentication before every admin has a working SSH key can lock everyone out."],
["lnx","Contain Before Eradicate","Isolate a breached host from the network before removing malware, to stop further lateral movement."],
["lnx","Credential Rotation","Any credential that may have been exposed during a breach must be rotated, not only the obviously compromised one."],
["lnx","Persistence Check","Review cron jobs, authorized_keys files, and startup services for attacker-planted backdoors."],
["lnx","Post-hardening Verification","Confirm fail2ban and UFW logs show blocked attempts before considering remediation complete."],

["bcdr","RTO","The maximum acceptable downtime before a service must be restored."],
["bcdr","RPO","The maximum acceptable data loss measured in time, which drives how often backups must run."],
["bcdr","Hot Site","A fully equipped, ready-to-run duplicate site giving near-zero RTO at the highest cost."],
["bcdr","Warm Site","A partially configured site with some hardware and data, balancing cost against recovery speed."],
["bcdr","Cold Site","A basic facility with power and space but no ready systems, cheapest but slowest to activate."],
["bcdr","Backup Frequency and RPO","Backups must run at least as often as the RPO requires, e.g. a 4-hour RPO needs backups every 4 hours or less."],
["bcdr","Budget Trade-off","A tighter RTO/RPO requires greater investment in redundant infrastructure and site readiness."],
["bcdr","Recovery Step Order","Declare the disaster, notify the team, assess damage, fail over, restore data, validate, then resume operations."],

["siem","Sigma Rule","A vendor-agnostic, generic signature format for writing SIEM detection logic."],
["siem","MITRE ATT&CK","A framework mapping observed adversary behavior to standardized tactics and techniques."],
["siem","Earliest Containment Point","The earliest stage in an attack chain where isolating or blocking would have prevented the most damage."],
["siem","SOAR Playbook","Automates response actions, such as isolating a host or disabling an account, triggered by a SIEM alert."],
["siem","Ransomware Kill Chain","Initial access, execution, persistence, privilege escalation, lateral movement, collection, exfiltration, then impact."],
["siem","Alert Correlation","Combining multiple low-confidence signals from different sources into one higher-confidence incident."],
["siem","Automated Containment","A SOAR action that isolates an infected endpoint from the network without waiting for human approval."],
["siem","Rule Tuning","Adjusting a detection rule's thresholds to cut down on alerts for expected, benign behavior."],

["acl","Least Privilege ACL","Allow only the specific ports and protocols actually required, denying everything else by default."],
["acl","Restricting Database Access","Only the application server's specific IP should be able to reach the database port, never the whole internet."],
["acl","Rule Order","Firewall ACLs are processed top-down; the first rule that matches a packet wins."],
["acl","Implicit Deny-all","Any traffic not explicitly allowed by an earlier rule is denied by default at the end of the list."],
["acl","Allowing Web Traffic","Permit inbound TCP 80 and 443 to the web server as needed for HTTP and HTTPS."],
["acl","Tiering the Database","Placing the database on its own subnet, unreachable directly from the internet, limits exposure."],

["fw","Rule Components","Direction, protocol, source CIDR, destination CIDR, port, and action together make up one firewall rule."],
["fw","CIDR Notation","A block like 192.168.1.0/24 represents a contiguous range of 256 addresses."],
["fw","Direction","An inbound rule governs traffic entering the network; an outbound rule governs traffic leaving it."],
["fw","Specific-to-general Ordering","More specific rules should be placed above more general ones so they are evaluated first."],
["fw","Implicit Deny-all Policy","The final rule of any ruleset denies anything that was not explicitly permitted above it."],
["fw","Stateful Firewalls","Automatically allow return traffic for connections already established, unlike a stateless firewall."],

["ids","True Positive","An alert correctly identifies real malicious activity."],
["ids","False Positive","An alert fires on benign activity that was mistakenly flagged as malicious."],
["ids","False Negative","Malicious activity occurs but no alert fires — often the most dangerous outcome."],
["ids","True Negative","Benign activity correctly produces no alert at all."],
["ids","Snort alert Action","Generates an alert but still allows the matching packet through, an IDS-style behavior."],
["ids","Snort drop Action","Silently discards the matching packet inline, an IPS-style blocking action."],
["ids","Snort reject Action","Blocks the matching packet and sends a reset or unreachable response to both endpoints."],
["ids","Choosing an Inline Action","Only use blocking actions like drop or reject when confidence in a rule is high, to avoid false-positive outages."],

["ir","Preparation","Building tools, training staff, and writing plans before any incident occurs."],
["ir","Identification","Detecting and confirming that a security incident has actually happened."],
["ir","Containment","Limiting the spread and impact of an incident, short-term isolation followed by longer-term measures."],
["ir","Eradication","Removing the root cause of an incident, such as malware or a backdoor, from every affected system."],
["ir","Recovery","Restoring affected systems to normal operation while monitoring closely for recurrence."],
["ir","Lessons Learned","The post-incident review used to improve tools, training, and plans for next time."],

["log","Patient Zero","The first host in the timeline to show signs of compromise, often via a phishing click or drive-by download."],
["log","Lateral Movement Signature","One host making unusual outbound connections or authentication attempts to several other internal hosts in quick succession."],
["log","Clean Host Indicators","No anomalous outbound traffic, no unexpected new processes, and normal authentication patterns across the logs."],
["log","Timestamp Correlation","Aligning log timestamps across hosts, accounting for time zone and clock skew, to reconstruct an accurate timeline."],
["log","Beaconing Pattern","Regular, periodic outbound connections to the same external address, often indicating command-and-control traffic."],
["log","Log Source Triage","Firewall, DNS, endpoint, and authentication logs each reveal a different piece of a compromise story."],

["netdiag","Firewall Placement","Sits at the network perimeter, filtering traffic as it crosses between trust zones."],
["netdiag","WAF Placement","Sits in front of web servers, typically in the DMZ, filtering Layer 7 HTTP(S) attacks."],
["netdiag","IDS Placement","Monitors a span or mirror port on a segment, observing traffic without sitting inline or blocking it."],
["netdiag","NAC Placement","Enforced at the network access edge, switch ports and wireless, checking device posture before granting entry."],
["netdiag","SIEM Placement","Centralized in the SOC, aggregating logs from every layer rather than sitting inline in traffic paths."],
["netdiag","DLP Placement","Deployed at egress points such as the email gateway, web proxy, or endpoint to catch sensitive data leaving."],

function pick(arr,n){const copy=arr.slice();const out=[];while(out.length<n && copy.length){const i=Math.floor(Math.random()*copy.length);out.push(copy.splice(i,1)[0]);}return out;}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ============ 1. MULTIPLE CHOICE ============ */
function renderMC(){
  const src = pool();
  const d0 = DIFFICULTIES[difficulty];
  const mc = { score:0, lives:d0.lives, timeLeft:d0.timer, maxTime:d0.timer, timer:null, current:null, locked:false };

  function newQuestion(){
    mc.locked=false;
    const correct = pick(src,1)[0];
    const wrongs = pick(src.filter(d=>d.def!==correct.def), Math.min(3, src.length-1));
    const options = shuffle([correct, ...wrongs]);
    mc.current = { correct, options };
    const df = DIFFICULTIES[difficulty];
    mc.maxTime = Math.max(df.minTimer, df.timer - Math.floor(mc.score/5));
    mc.timeLeft = mc.maxTime;
    draw();
    clearInterval(mc.timer);
    mc.timer = setInterval(()=>{
      mc.timeLeft -= 0.1;
      if(mc.timeLeft<=0){ mc.timeLeft=0; clearInterval(mc.timer); resolve(null); }
      updateBar();
    },100);
  }
  function updateBar(){
    const bar = document.getElementById('mcBar');
    if(!bar) return;
    const pct = Math.max(0,(mc.timeLeft/mc.maxTime)*100);
    bar.style.width = pct+'%';
    bar.style.background = pct<25? 'var(--danger)' : pct<55? 'var(--warn)' : 'var(--accent)';
  }
  function resolve(chosenIdx){
    if(mc.locked) return;
    mc.locked=true;
    clearInterval(mc.timer);
    const opts = document.querySelectorAll('.choice');
    const correctIdx = mc.current.options.findIndex(o=>o.def===mc.current.correct.def);
    const fb = document.getElementById('mcFeedback');
    if(chosenIdx===correctIdx){
      mc.score++;
      opts[chosenIdx].classList.add('correct');
      fb.textContent = 'Correct — '+mc.current.correct.term;
      fb.className='feedback ok';
    } else {
      mc.lives--;
      if(chosenIdx!==null) opts[chosenIdx].classList.add('wrong');
      opts[correctIdx].classList.add('correct');
      fb.textContent = (chosenIdx===null?'Time up — ':'Not quite — ')+mc.current.correct.term;
      fb.className='feedback bad';
    }
    opts.forEach(o=>o.classList.add('disabled'));
    updateHud();

/* ============ 2. MATCHING GAME ============ */
function renderMatch(){
  const src = pool();
  const uniq = (()=>{const seen=new Set();return src.filter(d=>{if(seen.has(d.term))return false;seen.add(d.term);return true;});})();
  const PAIR_COUNT = Math.max(2, Math.min(8, uniq.length));
  const pairs = pick(uniq, PAIR_COUNT);
  if(pairs.length<2){ app.innerHTML = head('match') + noticeInsufficient(); mountHeader(); return; }
  let cards = [];
  pairs.forEach(p=>{ cards.push({key:p.id, kind:'t', text:p.term}); cards.push({key:p.id, kind:'d', text:p.def}); });
  cards = shuffle(cards).map((c,i)=>({...c, uid:i, open:false, matched:false}));
  let openOnes = [], moves = 0, matchedPairs = 0, lock = false;

  function draw(){
    app.innerHTML = head('match') + `
      <div class="hud">
        <span><span class="k">MOVES</span><span class="v" id="mvCount">${moves}</span></span>
        <span><span class="k">PAIRS</span><span class="v" id="mpCount">${matchedPairs}/${PAIR_COUNT}</span></span>
      </div>
      <div class="match-grid" id="matchGrid"></div>`;
    mountHeader();
    const grid = document.getElementById('matchGrid');
    cards.forEach(c=>{
      const el=document.createElement('div');
      el.className='mcard hidden'+(c.kind==='t'?' term':'');
      el.dataset.uid=c.uid; el.textContent='?';
      el.onclick=()=>flip(c.uid);
      grid.appendChild(el);
    });
  }
  function refreshCard(c){
    const el = document.querySelector(`.mcard[data-uid="${c.uid}"]`);
    if(!el) return;
    if(c.matched){ el.className='mcard matched'+(c.kind==='t'?' term':''); el.textContent=c.text; }
    else if(c.open){ el.className='mcard'+(c.kind==='t'?' term':''); el.textContent=c.text; }
    else { el.className='mcard hidden'+(c.kind==='t'?' term':''); el.textContent='?'; }
  }
  function flip(uid){
    if(lock) return;
    const c = cards.find(x=>x.uid===uid);
    if(!c || c.open || c.matched) return;
    c.open=true; refreshCard(c); openOnes.push(c);
    if(openOnes.length===2){
      moves++; document.getElementById('mvCount').textContent=moves; lock=true;
      const [c1,c2]=openOnes;
      if(c1.key===c2.key && c1.kind!==c2.kind){
        c1.matched=true; c2.matched=true; matchedPairs++;
        setTimeout(()=>{
          refreshCard(c1); refreshCard(c2);
          document.getElementById('mpCount').textContent=matchedPairs+'/'+PAIR_COUNT;
          openOnes=[]; lock=false;
          if(matchedPairs===PAIR_COUNT) setTimeout(drawWin,500);
        },350);
      } else {
        [c1,c2].forEach(c=>{ const el=document.querySelector(`.mcard[data-uid="${c.uid}"]`); if(el) el.classList.add('wrongflash'); });
        setTimeout(()=>{ c1.open=false; c2.open=false; refreshCard(c1); refreshCard(c2); openOnes=[]; lock=false; },700);
      }
    }
  }
  function drawWin(){
    app.innerHTML = head('match') + `
      <div class="endscreen">
        <div class="sub" style="font-family:var(--mono);color:var(--text-dim);">BOARD CLEARED</div>
        <div class="big">${moves}</div>
        <p style="color:var(--text-dim);">moves to match all ${PAIR_COUNT} pairs.</p>
        <div class="row-gap" style="justify-content:center;margin-top:16px;">
          <button class="btn primary" id="mRestart">New board</button>
          <button class="btn ghost" id="mHome">Back to console</button>
        </div>
      </div>`;
    mountHeader();
    document.getElementById('mRestart').onclick=()=>renderMatch();
    document.getElementById('mHome').onclick=()=>{teardown();state.view='home';render();};
  }
  draw();
}

/* ============ 3. WHEEL OF FORTUNE ============ */
function renderWheel(){
  const src = pool();
  if(src.length<1){ app.innerHTML = head('wheel') + noticeInsufficient(); mountHeader(); return; }
  const SEGMENTS = [
    {label:'$300',value:300},{label:'$500',value:500},{label:'$150',value:150},
    {label:'BANKRUPT',value:'bankrupt'},{label:'$400',value:400},{label:'$250',value:250},
    {label:'$600',value:600},{label:'LOSE A TURN',value:'lose'},{label:'$350',value:350},
    {label:'$900',value:900},{label:'$200',value:200},{label:'$450',value:450}
  ];
  const w = { bank:0, round:0, strikes:0, spinning:false, spinValue:null, puzzle:null, guessed:new Set(), rotation:0 };

  function newPuzzle(){ w.puzzle = pick(src,1)[0]; w.guessed = new Set(); w.round = 0; w.strikes = 0; w.spinValue = null; draw(); }
  function phraseHtml(){
    const letters = w.puzzle.def.toUpperCase();
    return letters.split('').map(ch=>{
      if(/[A-Z]/.test(ch)) return w.guessed.has(ch) ? ch : '_';
      if(ch===' ') return '&nbsp;&nbsp;';
      return ch;
    }).join(' ');
  }
  function drawWheelCanvas(){
    const canvas = document.getElementById('wheelCanvas'); if(!canvas) return;
    const ctx = canvas.getContext('2d'); if(!ctx) return;
    const cx=140, cy=140, r=130;
    const panelC = cssVar('--panel') || '#101923';
    const panel2C = cssVar('--panel-2') || '#0c141c';
    const bgC = cssVar('--bg') || '#070c12';
    const accentC = cssVar('--accent') || '#57c7d4';
    const dangerC = cssVar('--danger') || '#ef5a68';
    const warnC = cssVar('--warn') || '#e8b34c';
    ctx.clearRect(0,0,280,280);
    const n = SEGMENTS.length; const arc = (Math.PI*2)/n;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(w.rotation);
    for(let i=0;i<n;i++){
      const start = i*arc, end=start+arc;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,start,end); ctx.closePath();
      const isSpecial = typeof SEGMENTS[i].value==='string';
      ctx.fillStyle = i%2===0 ? panelC : panel2C;
      ctx.fill(); ctx.strokeStyle = bgC; ctx.stroke();
      ctx.save(); ctx.rotate(start+arc/2); ctx.textAlign='right';
      ctx.fillStyle= isSpecial ? dangerC : accentC;
      ctx.font = '11px ui-monospace, monospace';
      ctx.fillText(SEGMENTS[i].label, r-8, 4);
      ctx.restore();
    }
    ctx.restore();
    ctx.fillStyle=warnC;
    ctx.beginPath(); ctx.moveTo(cx+r+6,cy-10); ctx.lineTo(cx+r+6,cy+10); ctx.lineTo(cx+r-8,cy); ctx.closePath(); ctx.fill();
  }
  redrawWheelIfOpen = drawWheelCanvas;
  function spin(){
    if(w.spinning) return; w.spinning=true; document.getElementById('spinBtn').disabled=true;
    const n=SEGMENTS.length; const targetIndex = Math.floor(Math.random()*n); const arc=(Math.PI*2)/n;
    const targetAngle = (Math.PI*2*6) + (Math.PI*2 - (targetIndex*arc + arc/2));
    const start = performance.now(); const duration = 3200; const from = w.rotation;
    const delta = targetAngle - (from % (Math.PI*2));
    function step(t){
      const p = Math.min(1,(t-start)/duration); const eased = 1-Math.pow(1-p,3);
      w.rotation = from + delta*eased; drawWheelCanvas();
      if(p<1){ requestAnimationFrame(step); }
      else { w.spinning=false; w.spinValue = SEGMENTS[targetIndex].value; landSpin(); }
    }
    requestAnimationFrame(step);
  }
  function landSpin(){
    const status = document.getElementById('wheelStatus');
    if(w.spinValue==='bankrupt'){
      w.round=0; status.textContent='BANKRUPT — round winnings wiped. Spin again.'; status.className='feedback bad';
      document.getElementById('spinBtn').disabled=false;
    } else if(w.spinValue==='lose'){
      status.textContent='LOSE A TURN — spin again.'; status.className='feedback bad';
      document.getElementById('spinBtn').disabled=false;
    } else {
      status.textContent='Landed on $'+w.spinValue+' — call a letter.'; status.className='feedback ok';
      enableKeyboard(true);
    }
  }
  function enableKeyboard(on){
    document.querySelectorAll('.kb button').forEach(b=>{ if(!b.classList.contains('hit') && !b.classList.contains('miss')) b.disabled=!on; });
    document.getElementById('spinBtn').disabled = on;
  }
  function guessLetter(letter){
    const btn = document.querySelector(`.kb button[data-l="${letter}"]`);
    const phraseUp = w.puzzle.def.toUpperCase();
    if(phraseUp.includes(letter)){
      w.guessed.add(letter);
      const count = phraseUp.split('').filter(ch=>ch===letter).length;
      w.round += count * (typeof w.spinValue==='number'?w.spinValue:0);
      btn.classList.add('hit');
      document.getElementById('phraseDisplay').innerHTML = phraseHtml();
      document.getElementById('roundVal').textContent = '$'+w.round;
      document.getElementById('wheelStatus').textContent = 'Nice — '+count+' letter'+(count>1?'s':'')+' found. Spin again.';
      document.getElementById('wheelStatus').className='feedback ok';
      checkSolved();
    } else {
      btn.classList.add('miss'); w.strikes++; updateStrikes();
      document.getElementById('wheelStatus').textContent = 'No '+letter+' in the definition.';
      document.getElementById('wheelStatus').className='feedback bad';
      if(w.strikes>=DIFFICULTIES[difficulty].strikes){ setTimeout(()=>revealAndEnd(false),700); return; }
    }
    enableKeyboard(false); btn.disabled=true;
  }
  function updateStrikes(){
    const wrap = document.getElementById('strikeWrap'); wrap.innerHTML='';
    const totalStrikes = DIFFICULTIES[difficulty].strikes;
    for(let i=0;i<totalStrikes;i++){ const d=document.createElement('div'); d.className='strike'+(i<w.strikes?' on':''); d.textContent='X'; wrap.appendChild(d); }
  }
  function checkSolved(){
    const letters = new Set(w.puzzle.def.toUpperCase().replace(/[^A-Z]/g,'').split(''));
    const allGot = [...letters].every(l=>w.guessed.has(l));
    if(allGot) revealAndEnd(true);
  }
  function trySolve(){
    const val = document.getElementById('solveInput').value.trim().toLowerCase();
    if(val && val===w.puzzle.def.toLowerCase()){ revealAndEnd(true); }
    else { const status=document.getElementById('wheelStatus'); status.textContent='Not the definition — keep spinning.'; status.className='feedback bad'; }
  }
  function revealAndEnd(won){
    if(won) w.bank += w.round;
    app.innerHTML = head('wheel') + `
      <div class="endscreen">
        <div class="sub" style="font-family:var(--mono);color:var(--text-dim);">${won?'SOLVED':'OUT OF STRIKES'}</div>
        <div class="phrase" style="font-size:15px;letter-spacing:1px;">${w.puzzle.term} = ${w.puzzle.def}</div>
        <div class="big">$${w.bank}</div>
        <p style="color:var(--text-dim);">total winnings banked</p>
        <div class="row-gap" style="justify-content:center;margin-top:16px;">
          <button class="btn primary" id="wNext">Next puzzle</button>
          <button class="btn ghost" id="wHome">Back to console</button>
        </div>
      </div>`;
    mountHeader();
    document.getElementById('wNext').onclick=()=>newPuzzle();
    document.getElementById('wHome').onclick=()=>{teardown();state.view='home';render();};
  }
  function draw(){
    app.innerHTML = head('wheel') + `
      <div class="hud">
        <span><span class="k">BANK</span><span class="v">$${w.bank}</span></span>
        <span><span class="k">ROUND</span><span class="v" id="roundVal">$${w.round}</span></span>
        <span class="k">DIFFICULTY</span><span class="v">${DIFFICULTIES[difficulty].label}</span>
        <span class="k">STRIKES</span><div class="strikes" id="strikeWrap"></div>
      </div>
      <div class="clue-hint">Guess the definition of: <b style="color:var(--accent)">${w.puzzle.term}</b> (${DOMAINS[w.puzzle.domain]})</div>
      <div class="phrase" id="phraseDisplay">${phraseHtml()}</div>
      <div class="wheel-wrap">
        <canvas id="wheelCanvas" width="280" height="280"></canvas>
        <div class="spin-col">
          <button class="btn primary" id="spinBtn">Spin the wheel</button>
          <div class="row-gap">
            <input id="solveInput" placeholder="Solve the definition..." style="font-family:var(--mono);background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 10px;font-size:13px;">
            <button class="btn" id="solveBtn">Solve</button>
          </div>
        </div>
      </div>
      <div class="feedback" id="wheelStatus"></div>
      <div class="kb" id="kb"></div>`;
    mountHeader(); updateStrikes(); drawWheelCanvas();
    document.getElementById('spinBtn').onclick=spin;
    document.getElementById('solveBtn').onclick=trySolve;
    const kb = document.getElementById('kb');
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l=>{
      const b=document.createElement('button'); b.textContent=l; b.dataset.l=l; b.disabled=true;
      b.onclick=()=>guessLetter(l); kb.appendChild(b);
    });
  }
  newPuzzle();
}

function renderJeopardy(groups, boardTitle){
  const values = [100,200,300,400,500];
  const board = groups.map(g=>{
    const poolAll = TERMS.filter(d=>g.domains.includes(d.domain));
    return { label:g.label, items: pick(poolAll, 5) };
  });
  let used = {}; let score = 0;

  function cellKey(ci,vi){ return ci+'-'+vi; }
  function draw(){
    app.innerHTML = head('jeopardy') + `<div class="score-strip">${boardTitle} &middot; SCORE: $${score}</div><div id="boardWrap"></div>`;
    mountHeader();
    const wrap = document.getElementById('boardWrap');
    const catRow = document.createElement('div');
    catRow.className='jcat-row'; catRow.style.gridTemplateColumns=`repeat(${board.length},1fr)`;
    board.forEach(col=>{ const c=document.createElement('div'); c.className='jcat'; c.textContent=col.label; catRow.appendChild(c); });
    wrap.appendChild(catRow);
    values.forEach((val,vi)=>{
      const row=document.createElement('div'); row.className='jcat-row'; row.style.gridTemplateColumns=`repeat(${board.length},1fr)`;
      board.forEach((col,ci)=>{
        const cell=document.createElement('div'); const key=cellKey(ci,vi);
        cell.className='jcell'+(used[key]?' used':''); cell.textContent='$'+val;
        if(!used[key]) cell.onclick=()=>openClue(ci,vi,val);
        row.appendChild(cell);
      });
      wrap.appendChild(row);
    });
  }
  function openClue(ci,vi,val){
    const item = board[ci].items[vi]; const key = cellKey(ci,vi);
    const modal = document.createElement('div'); modal.className='clue-modal';
    modal.innerHTML = `
      <div class="clue-box">
        <div class="cat">${board[ci].label} · $${val}</div>
        <div class="cluetext">${item.clue||item.def}</div>
        <input id="jAnswer" placeholder="Name the concept..." autocomplete="off">
        <div class="answer-reveal" id="jReveal" style="display:none;">${item.term}</div>
        <div class="row-gap">
          <button class="btn primary" id="jSubmit">Submit</button>
          <button class="btn" id="jReveal2">Reveal answer</button>
          <button class="btn ghost" id="jClose">Close</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    const input = document.getElementById('jAnswer'); input.focus();
    let answered=false;
    function norm(s){ return s.trim().toLowerCase().replace(/[^a-z0-9]/g,''); }
    function finish(correct){
      if(answered) return; answered=true; used[key]=true;
      if(correct) score += val; else score -= val;
      document.getElementById('jReveal').style.display='block';
      setTimeout(()=>{ document.body.removeChild(modal); draw(); }, correct?900:1600);
    }
    document.getElementById('jSubmit').onclick=()=>{
      const v = norm(input.value);
      const correct = v===norm(item.term) || v.length>3 && norm(item.term).includes(v) && v.length>=norm(item.term).length-2;
      if(v===norm(item.term)){ finish(true); }
      else {
        input.style.borderColor='var(--danger)';
        document.getElementById('jReveal').style.display='block';
        document.getElementById('jReveal').style.color='var(--danger)';
        setTimeout(()=>finish(false), 1400);
      }
    };
    document.getElementById('jReveal2').onclick=()=>{ document.getElementById('jReveal').style.display='block'; };
    document.getElementById('jClose').onclick=()=>{ used[key]=true; document.body.removeChild(modal); draw(); };
    input.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('jSubmit').click(); });
  }
  draw();
}

function renderSequence(id){
  const scenario = SEQUENCES.find(s=>s.id===id);
  let poolItems = shuffle(scenario.steps.map((s,i)=>({text:s, correctIndex:i})));
  let yourOrder = [];

  function draw(){
    app.innerHTML = head('seq') + `
      <h2 style="font-family:var(--mono);font-size:16px;color:var(--accent);margin:0 0 4px;">${scenario.title}</h2>
      <p style="color:var(--text-dim);font-size:13px;margin:0 0 16px;">Click items below in what you believe is the correct order.</p>
      <div class="seq-list" id="seqList"></div>
      <div class="seq-pool" id="seqPool"></div>`;
    mountHeader();
    const listEl = document.getElementById('seqList');
    yourOrder.forEach((it,i)=>{
      const row=document.createElement('div'); row.className='seq-row';
      row.innerHTML = `<span class="num">${i+1}.</span><span>${it.text}</span>`;
      listEl.appendChild(row);
    });
    const poolEl = document.getElementById('seqPool');
    poolItems.forEach((it,i)=>{
      const chip=document.createElement('div'); chip.className='seq-chip'; chip.textContent=it.text;
      chip.onclick=()=>{ yourOrder.push(it); poolItems.splice(i,1); if(poolItems.length===0){ setTimeout(finish,150); } else { draw(); } };
      poolEl.appendChild(chip);
    });
  }
  function finish(){
    let correctCount=0;
    app.innerHTML = head('seq') + `
      <h2 style="font-family:var(--mono);font-size:16px;color:var(--accent);margin:0 0 4px;">${scenario.title} — results</h2>
      <div class="seq-list" id="resultList"></div>
      <div class="score-strip" id="seqScore" style="margin-top:16px;"></div>
      <div class="row-gap">
        <button class="btn primary" id="seqRetry">Try again</button>
        <button class="btn" id="seqOther">Choose another scenario</button>
        <button class="btn ghost" id="seqHome">Back to console</button>
      </div>`;
    mountHeader();
    const rl = document.getElementById('resultList');
    yourOrder.forEach((it,i)=>{
      const ok = it.correctIndex===i;
      if(ok) correctCount++;
      const row=document.createElement('div'); row.className='seq-row '+(ok?'correct':'wrong');
      row.innerHTML = `<span class="num">${i+1}.</span><span>${it.text}</span>` + (ok?'':`<span class="correction">correct position: ${it.correctIndex+1}</span>`);
      rl.appendChild(row);
    });
    document.getElementById('seqScore').textContent = correctCount+' / '+scenario.steps.length+' in the correct position';
    document.getElementById('seqRetry').onclick=()=>renderSequence(id);
    document.getElementById('seqOther').onclick=()=>{ state.view='seqpick'; render(); };
    document.getElementById('seqHome').onclick=()=>{ teardown(); state.view='home'; render(); };
  }
  draw();
}

    <p class="intro">Pick a scenario. Select an item, then click the zone or bucket you think it belongs in — feedback is immediate.</p>
    <div class="grid">
      ${PLACEMENTS.map(s=>`<div class="node" data-id="${s.id}"><div class="tag">${s.items.length} ITEMS · ${s.zones.length} ZONES</div><h2>${s.title}</h2></div>`).join('')}
    </div>`;
  mountHeader();
  document.querySelectorAll('.node').forEach(n=>{ n.onclick=()=>{ state.placeId=n.dataset.id; state.view='place'; render(); }; });
}
function renderPlacement(id){
  const scenario = PLACEMENTS.find(s=>s.id===id);
  let poolItems = shuffle(scenario.items.slice());
  let placedByZone = {}; scenario.zones.forEach(z=>placedByZone[z]=[]);
  let selected = null; let correctCount=0; let mistakes=0;

  function draw(){
    app.innerHTML = head('place') + `
      <h2 style="font-family:var(--mono);font-size:16px;color:var(--accent);margin:0 0 4px;">${scenario.title}</h2>
      <p style="color:var(--text-dim);font-size:13px;margin:0 0 16px;">Select an item below, then click the zone it belongs in.</p>
      <div class="hud"><span><span class="k">PLACED</span><span class="v" id="plScore">${correctCount}/${scenario.items.length}</span></span>
      <span><span class="k">MISTAKES</span><span class="v" id="plMiss">${mistakes}</span></span></div>
      <div class="zones" id="zonesWrap" style="grid-template-columns:repeat(${Math.min(scenario.zones.length,4)},1fr);"></div>
      <div class="place-pool" id="placePool"></div>`;
    mountHeader();
    const zw = document.getElementById('zonesWrap');
    scenario.zones.forEach(z=>{
      const box=document.createElement('div'); box.className='zone-box'; box.dataset.zone=z;
      box.innerHTML = `<div class="zone-title">${z}</div><div class="zone-items"></div>`;
      const itemsEl = box.querySelector('.zone-items');
      placedByZone[z].forEach(it=>{ const chip=document.createElement('div'); chip.className='placed-chip'; chip.textContent=it.name; itemsEl.appendChild(chip); });
      box.onclick=()=>attemptPlace(z, box);
      zw.appendChild(box);
    });
    const pp = document.getElementById('placePool');
    poolItems.forEach((it,i)=>{
      const chip=document.createElement('div'); chip.className='place-chip'+(selected===i?' selected':'');
      chip.textContent=it.name;
      chip.onclick=(e)=>{ e.stopPropagation(); selected = (selected===i)?null:i; draw(); };
      pp.appendChild(chip);
    });
  }
  function attemptPlace(zone, box){
    if(selected===null) return;
    const item = poolItems[selected];
    if(item.zone===zone){
      placedByZone[zone].push(item);
      poolItems.splice(selected,1);
      correctCount++; selected=null;
      if(poolItems.length===0){ setTimeout(finish,300); } else { draw(); }
    } else {
      mistakes++;
      box.classList.add('flash');
      setTimeout(()=>box.classList.remove('flash'),450);
      document.getElementById('plMiss').textContent = mistakes;
      selected=null; draw();
    }
  }
  function finish(){
    app.innerHTML = head('place') + `
      <div class="endscreen">
        <div class="sub" style="font-family:var(--mono);color:var(--text-dim);">SCENARIO COMPLETE</div>
        <div class="big">${correctCount}/${scenario.items.length}</div>
        <p style="color:var(--text-dim);">placed correctly, with ${mistakes} mistake${mistakes===1?'':'s'} along the way.</p>
        <div class="row-gap" style="justify-content:center;margin-top:16px;">
          <button class="btn primary" id="plRetry">Try again</button>
          <button class="btn" id="plOther">Choose another scenario</button>
          <button class="btn ghost" id="plHome">Back to console</button>
        </div>
      </div>`;
    mountHeader();
    document.getElementById('plRetry').onclick=()=>renderPlacement(id);
    document.getElementById('plOther').onclick=()=>{ state.view='placepick'; render(); };
    document.getElementById('plHome').onclick=()=>{ teardown(); state.view='home'; render(); };
  }
  draw();
}

render();
</script>
</body>
</html>
